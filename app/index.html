<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小组协作回放</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div><h1>小组协作回放</h1><p>共享代码、笔记与对话的真实时间线</p></div>
      </div>
      <label class="group-control"><span>小组</span><select id="groupSelect"></select></label>
      <div id="memberLegend" class="member-legend" aria-label="成员颜色和当前状态"></div>
      <a id="analysisLink" class="text-button" href="/app/analysis.html">事后分析</a>
    </header>

    <main id="replayShell" class="replay-shell" aria-busy="true">
      <section class="workspace" aria-label="小组回放工作区">
        <section id="codePanel" class="panel code-panel" aria-labelledby="codeTitle">
          <header class="panel-header">
            <div><h2 id="codeTitle">共享代码</h2><p id="codeMeta">等待数据</p></div>
            <span id="codeActor" class="actor-badge">尚无快照</span>
          </header>
          <div class="code-context">
            <span id="changeSummary">尚未发生代码变化</span>
            <span id="cursorSummary">文本光标未记录</span>
          </div>
          <div id="codeView" class="code-view" role="region" aria-label="当前完整共享代码"></div>
        </section>

        <section id="previewPanel" class="panel preview-panel" aria-labelledby="previewTitle">
          <header class="panel-header">
            <div><h2 id="previewTitle">实时可视结果</h2><p id="previewMeta">与当前代码快照同步</p></div>
            <div class="preview-header-actions">
              <span id="previewState" class="preview-state is-waiting">等待代码</span>
              <button id="previewZoom" class="preview-zoom" type="button" title="恢复智能缩放" aria-label="恢复智能缩放">--</button>
              <button id="previewToggle" class="panel-icon-button" type="button" title="放大预览" aria-label="放大实时可视结果" aria-pressed="false">⛶</button>
            </div>
          </header>
          <div id="previewStage" class="preview-stage" role="region" aria-label="当前 Vega-Lite 代码生成的可视化结果">
            <div id="visualization" class="visualization"></div>
            <div id="previewMessage" class="preview-message">
              <strong>等待第一条代码快照</strong>
              <span>可视化不会早于对应代码出现</span>
            </div>
          </div>
        </section>

        <section class="context-panel" aria-label="共享笔记和房间聊天">
          <div class="compact-tabs" role="tablist" aria-label="右侧内容">
            <button class="context-tab" type="button" role="tab" data-context="notes" aria-selected="false">共享笔记</button>
            <button class="context-tab is-active" type="button" role="tab" data-context="chat" aria-selected="true">房间聊天 / AI</button>
          </div>
          <section id="notesPane" class="context-pane notes-pane" data-context-pane="notes" aria-labelledby="notesTitle">
            <header class="panel-header">
              <div><h2 id="notesTitle">共享笔记</h2><p id="noteMeta">按快照恢复</p></div>
              <span id="noteActor" class="actor-badge">尚无快照</span>
            </header>
            <div id="noteView" class="note-view"></div>
          </section>
          <section id="chatPane" class="context-pane chat-pane is-active" data-context-pane="chat" aria-labelledby="chatTitle">
            <header class="panel-header">
              <div><h2 id="chatTitle">房间聊天 / AI</h2><p id="chatMeta">消息只在发送时间后出现</p></div>
            </header>
            <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
          </section>
        </section>
      </section>

      <section class="lower-panel" aria-label="活动和操作记录">
        <section class="activity-pane">
          <header class="subpanel-header"><h2>最近活动</h2><span>点击跳转到事件</span></header>
          <div id="activityList" class="activity-list"></div>
        </section>
        <section class="action-pane">
          <header class="subpanel-header"><h2>页面操作与任务完成</h2><span id="completionStatus">尚未完成</span></header>
          <div id="actionSummary" class="action-summary"></div>
          <p class="data-caveat">记录了结果页、数据、PDF、发送和上传等按钮操作；没有终端输出或测试成败数据。</p>
        </section>
      </section>
    </main>

    <footer class="timeline-dock">
      <div class="timeline-topline">
        <div id="markerLegend" class="marker-legend"></div>
        <span class="kind-legend"><i class="kind-code"></i>代码 <i class="kind-note"></i>笔记 <i class="kind-chat"></i>消息 <i class="kind-action"></i>操作</span>
      </div>
      <div id="markerLane" class="marker-lane" aria-hidden="true"></div>
      <input id="timeline" class="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="小组统一时间轴" />
      <div class="playback-row">
        <button id="playButton" class="icon-button" type="button" title="播放" aria-label="播放">▶</button>
        <button id="restartButton" class="icon-button secondary" type="button" title="回到开始" aria-label="回到开始">↶</button>
        <label class="speed-control"><span>速度</span><select id="speedSelect"><option value="1">1×</option><option value="5">5×</option><option value="15">15×</option><option value="60" selected>60×</option></select></label>
        <div class="time-readout"><strong id="currentTime">--:--:--</strong><span id="elapsedTime">00:00 / 00:00</span></div>
        <div id="dataNote" class="data-note">正在读取真实数据…</div>
      </div>
    </footer>

    <script src="/app/vendor/vega.min.js"></script>
    <script src="/app/vendor/vega-lite.min.js"></script>
    <script src="/app/vendor/vega-embed.min.js"></script>
    <script type="module" src="/app/app.js"></script>
  </body>
</html>
